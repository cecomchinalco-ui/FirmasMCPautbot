name: Render Health Check

on:
  schedule:
   - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render service
        run: |
          echo "Hora UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"

          codigo=$(curl --silent --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 80 \
            --output /dev/null \
            --write-out "%{http_code}" \
            https://firmasmcpautbot.onrender.com/ || true)

          echo "HTTP status: $codigo"

          case "$codigo" in
            2*|3*|4*)
              echo "Render respondió al chequeo."
              exit 0
              ;;
            *)
              echo "No se obtuvo una respuesta HTTP válida."
              exit 1
              ;;
          esac
