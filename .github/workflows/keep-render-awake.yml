name: Render Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render service
        run: |
          echo "Hora de comprobación UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          for intento in 1 2; do
            echo "Intento $intento de comprobar Render"

            codigo=$(curl --silent --show-error --location \
              --connect-timeout 15 \
              --max-time 50 \
              --output /dev/null \
              --write-out "%{http_code}" \
              https://firmasmcpautbot.onrender.com/ || true)

            echo "HTTP status: $codigo"

            if [ "$codigo" = "200" ]; then
              echo "Servicio accesible."
              exit 0
            fi

            echo "La comprobación no devolvió HTTP 200."

            if [ "$intento" -eq 1 ]; then
              sleep 5
            fi
          done

          echo "ERROR: Render no devolvió HTTP 200."
          exit 1
